# Porta da API
quarkus.http.port=8080

# CORS liberado para o Front-End (React, HTML puro, etc.) consumir a API de qualquer origem
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

# Datas no formato ISO (2026-10-20T09:30:00) no JSON
quarkus.jackson.write-dates-as-timestamps=false

# Swagger UI disponivel em http://localhost:8080/q/swagger-ui (tambem fora do modo dev)
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Reun.IA API
quarkus.smallrye-openapi.info-version=4.0.0
quarkus.smallrye-openapi.info-description=API RESTful da Reun.IA - analise inteligente de reunioes comerciais (Challenge TOTVS / FIAP)
