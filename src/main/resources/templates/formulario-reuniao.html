<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reun.IA - Agendar Reunião</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/telas">Reun.IA</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/telas">Início</a>
            <a class="nav-link" href="/telas/clientes">Clientes</a>
            <a class="nav-link active" href="/telas/reunioes">Reuniões</a>
        </div>
    </div>
</nav>
<div class="container mb-5">
    <h1 class="mt-5">Nova Reunião</h1>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <form action="/telas/reunioes" method="post">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="titulo" name="titulo" th:value="${reuniao?.titulo()}" required>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="dataHora" class="form-label">Data e hora</label>
                <input type="datetime-local" class="form-control" id="dataHora" name="dataHora" th:value="${reuniao?.dataHora()}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="duracaoMinutos" class="form-label">Duração (minutos)</label>
                <input type="number" class="form-control" id="duracaoMinutos" name="duracaoMinutos" min="1" max="1440"
                       th:value="${reuniao?.duracaoMinutos()}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select class="form-select" id="tipo" name="tipo" required>
                    <option value="VENDAS" th:selected="${reuniao?.tipo() == 'VENDAS'}">Vendas</option>
                    <option value="CS" th:selected="${reuniao?.tipo() == 'CS'}">Customer Success (CS)</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="codigoCliente" class="form-label">Cliente</label>
                <select class="form-select" id="codigoCliente" name="codigoCliente" required>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.codigo}" th:text="${cliente.nome}"
                            th:selected="${reuniao?.codigoCliente() == cliente.codigo}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="codigoUsuario" class="form-label">Responsável</label>
                <select class="form-select" id="codigoUsuario" name="codigoUsuario" required>
                    <option th:each="usuario : ${usuarios}" th:value="${usuario.codigo}" th:text="${usuario.nome}"
                            th:selected="${reuniao?.codigoUsuario() == usuario.codigo}"></option>
                </select>
            </div>
        </div>

        <h5 class="mt-3">Preencha se a reunião for de VENDAS</h5>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="valorOportunidade" class="form-label">Valor da oportunidade (R$)</label>
                <input type="number" class="form-control" id="valorOportunidade" name="valorOportunidade" step="0.01" min="0"
                       th:value="${reuniao?.valorOportunidade()}">
            </div>
            <div class="col-md-4 mb-3">
                <label for="scoreRisco" class="form-label">Risco de perda (0 a 100)</label>
                <input type="number" class="form-control" id="scoreRisco" name="scoreRisco" min="0" max="100"
                       th:value="${reuniao?.scoreRisco()}">
            </div>
            <div class="col-md-4 mb-3 form-check mt-4">
                <input type="checkbox" class="form-check-input" id="concorrente" name="concorrente" value="true">
                <label for="concorrente" class="form-check-label">Concorrente envolvido</label>
            </div>
        </div>

        <h5 class="mt-3">Preencha se a reunião for de CS</h5>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="nps" class="form-label">NPS (0 a 10)</label>
                <input type="number" class="form-control" id="nps" name="nps" min="0" max="10" th:value="${reuniao?.nps()}">
            </div>
            <div class="col-md-4 mb-3">
                <label for="reclamacoes" class="form-label">Reclamações</label>
                <input type="number" class="form-control" id="reclamacoes" name="reclamacoes" min="0"
                       th:value="${reuniao?.reclamacoes()}">
            </div>
            <div class="col-md-4 mb-3 form-check mt-4">
                <input type="checkbox" class="form-check-input" id="sinalChurn" name="sinalChurn" value="true">
                <label for="sinalChurn" class="form-check-label">Sinal de cancelamento (churn)</label>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/telas/reunioes" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
