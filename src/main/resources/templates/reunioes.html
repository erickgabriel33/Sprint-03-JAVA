<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reun.IA - Reuniões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/telas">Reun.IA</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/telas">Início</a>
            <a class="nav-link" href="/telas/clientes">Clientes</a>
            <a class="nav-link active" href="/telas/reunioes">Reuniões</a>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="mt-5">Lista de Reuniões</h1>
    <a href="/telas/reunioes/novo" class="btn btn-primary mb-3">Agendar Nova Reunião</a>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Código</th><th>Título</th><th>Cliente</th><th>Data e hora</th><th>Tipo</th><th>Status</th><th>Prioridade</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reuniao : ${reunioes}">
            <td th:text="${reuniao.codigo}"></td>
            <td th:text="${reuniao.titulo}"></td>
            <td th:text="${nomesClientes[reuniao.codigoCliente]}"></td>
            <td th:text="${#temporals.format(reuniao.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${reuniao.tipo}"></td>
            <td th:text="${reuniao.status}"></td>
            <td>
                <span class="badge"
                      th:classappend="${reuniao.nivelPrioridade == 'ALTA'} ? 'text-bg-danger' : (${reuniao.nivelPrioridade == 'MEDIA'} ? 'text-bg-warning' : 'text-bg-success')"
                      th:text="${reuniao.prioridade + ' - ' + reuniao.nivelPrioridade}"></span>
            </td>
            <td><a th:href="@{/telas/reunioes/{codigo}(codigo=${reuniao.codigo})}" class="btn btn-sm btn-outline-primary">Detalhes</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
