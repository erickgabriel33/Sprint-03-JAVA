<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reun.IA - Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/telas">Reun.IA</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/telas">Início</a>
            <a class="nav-link active" href="/telas/clientes">Clientes</a>
            <a class="nav-link" href="/telas/reunioes">Reuniões</a>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="mt-5">Lista de Clientes</h1>
    <a href="/telas/clientes/novo" class="btn btn-primary mb-3">Cadastrar Novo Cliente</a>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Código</th><th>Nome</th><th>CNPJ</th><th>Segmento</th><th>Porte</th><th>E-mail</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.codigo}"></td>
            <td th:text="${cliente.nome}"></td>
            <td th:text="${cliente.cnpj}"></td>
            <td th:text="${cliente.segmento}"></td>
            <td th:text="${cliente.porte}"></td>
            <td th:text="${cliente.email}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
