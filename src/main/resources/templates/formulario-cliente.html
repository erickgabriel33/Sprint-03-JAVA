<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reun.IA - Cadastrar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/telas">Reun.IA</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/telas">Início</a>
            <a class="nav-link active" href="/telas/clientes">Clientes</a>
            <a class="nav-link" href="/telas/reunioes">Reuniões</a>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="mt-5">Novo Cliente</h1>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <form action="/telas/clientes" method="post">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" th:value="${cliente?.nome()}" required>
        </div>
        <div class="mb-3">
            <label for="cnpj" class="form-label">CNPJ (somente números)</label>
            <input type="text" class="form-control" id="cnpj" name="cnpj" maxlength="14" th:value="${cliente?.cnpj()}" required>
        </div>
        <div class="mb-3">
            <label for="segmento" class="form-label">Segmento</label>
            <input type="text" class="form-control" id="segmento" name="segmento" placeholder="Ex.: Varejo, Indústria, Logística"
                   th:value="${cliente?.segmento()}" required>
        </div>
        <div class="mb-3">
            <label for="porte" class="form-label">Porte</label>
            <select class="form-select" id="porte" name="porte" required>
                <option value="PEQUENO" th:selected="${cliente?.porte() == 'PEQUENO'}">Pequeno</option>
                <option value="MEDIO" th:selected="${cliente?.porte() == 'MEDIO'}">Médio</option>
                <option value="GRANDE" th:selected="${cliente?.porte() == 'GRANDE'}">Grande</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail de contato</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${cliente?.email()}">
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/telas/clientes" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
